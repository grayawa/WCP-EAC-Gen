name: FEXCore Linux EAC Experimental

# Experimental FEXCore package from StonkGuy/FEX eac-2610.3.
# WARNING: This only packages Proton Wine DLLs and unixlibs, NOT the patched
# Linux FEXInterpreter/FEXLoader. It does not by itself enable Linux EAC.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Build identifier (fixed to 2610.3)'
        required: false
        default: '2610.3'
      release_tag:
        description: 'Release to publish to'
        required: false
        default: 'FexCore-Linux-EAC'

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          VERSIONS: ${{ github.event.inputs.versions }}
        run: |
          set -euo pipefail
          list=$(printf '%s\n' $VERSIONS | jq -R . | jq -cs .)
          echo "matrix=$list" >> "$GITHUB_OUTPUT"
          echo "Building: $list"

  build:
    name: FEX-EAC-${{ matrix.version }}
    needs: plan
    # 22.04 = glibc 2.35 for the cross toolchain, so the .so files need nothing newer than the
    # glibc every current Linux rootfs has (Valve's own FEX unixlib asks for 2.34).
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils zstd jq git zip file \
            build-essential python3 pkg-config cmake ninja-build wget \
            g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup llvm-mingw
        run: |
          LLVM_MINGW_TAG="20251104"
          # FEX-2505 links clang_rt.builtins-arm64ec by its old name; build it with the llvm-mingw of its day.
          if [ "$(printf '%s\n' "${{ matrix.version }}" 2507 | sort -V | head -1)" != 2507 ]; then
            LLVM_MINGW_TAG="20250430"
          fi
          echo "llvm-mingw $LLVM_MINGW_TAG"
          TOOLCHAIN_DIR="/opt/llvm-mingw"
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz" -O llvm.tar.xz
          sudo rm -rf "$TOOLCHAIN_DIR" && sudo mkdir -p "$TOOLCHAIN_DIR"
          sudo tar -C "$TOOLCHAIN_DIR" --strip-components=1 -xJf llvm.tar.xz
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Clone patched FEX eac-2610.3
        run: |
          set -euo pipefail
          test "${{ matrix.version }}" = "2610.3"
          git clone --depth 1 --branch eac-2610.3 --recurse-submodules --shallow-submodules \\
            https://github.com/StonkGuy/FEX.git source
          git -C source fetch --depth 1 origin refs/tags/eac-2610.3:refs/tags/eac-2610.3
          test "$(git -C source describe --tags --exact-match)" = "eac-2610.3"
          echo "FEX_OVERRIDE=-DOVERRIDE_VERSION=eac-2610.3" >> "$GITHUB_ENV"
          echo "COMMIT=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build the DLLs (arm64ec + wow64)
        run: |
          set -euo pipefail
          cd source
          # The toolchain file moved into Data/CMake after FEX-2505.
          TOOLCHAIN="$PWD/Data/CMake/toolchain_mingw.cmake"
          [ -f "$TOOLCHAIN" ] || TOOLCHAIN="$PWD/toolchain_mingw.cmake"
          [ -f "$TOOLCHAIN" ] || { echo "::error::no toolchain_mingw.cmake in FEX-${{ matrix.version }}"; exit 1; }
          # FEX-2507 and older bundle an fmt whose format.h uses malloc/free without <cstdlib>,
          # which today's llvm-mingw no longer pulls in indirectly.
          EXTRA_CXX=""
          if [ "$(printf '%s\n' "${{ matrix.version }}" 2508 | sort -V | head -1)" != 2508 ]; then
            EXTRA_CXX="-include cstdlib"
          fi
          build_arch() {
            local triple="$1" dest="$2" dir="build-$1"
            rm -rf "$dir" && mkdir "$dir" && cd "$dir"
            cmake -G Ninja -Wno-dev \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
              -DMINGW_TRIPLE="${triple}-w64-mingw32" \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=/usr/lib/wine/aarch64-windows \
              -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
              -DENABLE_LTO=False -DENABLE_ASSERTIONS=False -DBUILD_TESTING=False \
              -DBUILD_TESTS=False \
              ${EXTRA_CXX:+-DCMAKE_CXX_FLAGS="$EXTRA_CXX"} \
              ${FEX_OVERRIDE:+"$FEX_OVERRIDE"} \
              ..
            ninja -j 4
            DESTDIR="$dest" ninja install
            cd ..
          }
          build_arch arm64ec "$GITHUB_WORKSPACE/stage-ec"
          build_arch aarch64 "$GITHUB_WORKSPACE/stage-wow"

      - name: Build the unixlibs (aarch64 glibc)
        run: |
          set -euo pipefail
          if [ ! -f source/Source/Windows/UnixLib/FEXUnixLib.cpp ]; then
            echo "FEX-${{ matrix.version }} predates the unixlib (added in 2607): DLL-only package."
            echo "HAS_UNIXLIB=0" >> "$GITHUB_ENV"
            exit 0
          fi
          # FEX's own CMake project for the two targets (same source, links librt), configured
          # standalone for aarch64 Linux.
          cmake -S source/Source/Windows/UnixLib -B build-unix -G Ninja -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib/wine/aarch64-unix
          ninja -C build-unix
          DESTDIR="$GITHUB_WORKSPACE/stage-unix" ninja -C build-unix install
          echo "HAS_UNIXLIB=1" >> "$GITHUB_ENV"

      - name: Package
        run: |
          set -euo pipefail
          V="${{ matrix.version }}"
          NAME="FEXCore-${V}-eac-linux"
          PKG="$GITHUB_WORKSPACE/pkg/$NAME"
          WIN="$PKG/files/lib/wine/aarch64-windows"
          UNIX="$PKG/files/lib/wine/aarch64-unix"
          mkdir -p "$WIN"

          cp "$(find stage-ec -type f -name '*.dll' | head -n1)" "$WIN/libarm64ecfex.dll"
          cp "$(find stage-wow -type f -name '*.dll' | head -n1)" "$WIN/libwow64fex.dll"
          llvm-strip --strip-all "$WIN"/*.dll

          if [ "$HAS_UNIXLIB" = "1" ]; then
            mkdir -p "$UNIX"
            for n in libarm64ecfex libwow64fex; do
              cp "$(find stage-unix -type f -name "$n.so" | head -n1)" "$UNIX/$n.so"
            done
            aarch64-linux-gnu-strip --strip-unneeded "$UNIX"/*.so
            chmod 0755 "$UNIX"/*.so
          fi

          {
            echo "StonkGuy FEX eac-${V} for Linux (glibc) Proton, ARM64"
            echo "source: https://github.com/StonkGuy/FEX/tree/eac-${V} (${COMMIT})"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ) by ${GITHUB_REPOSITORY} run ${GITHUB_RUN_ID}"
            if [ "$HAS_UNIXLIB" = "1" ]; then
              echo "files:  2 DLLs (aarch64-windows) + 2 glibc unixlibs (aarch64-unix), one matched build"
            else
              echo "files:  2 DLLs (aarch64-windows); this FEX predates the unixlib"
            fi
            echo
            echo "Install: unpack into the Proton's folder (the one holding 'proton' and 'files/'),"
            echo "after backing up its files/lib/wine/aarch64-windows/lib*fex.dll and aarch64-unix/lib*fex.so."
          } > "$PKG/FEX-VERSION.txt"
          ( cd "$PKG" && find files -type f | sort | xargs sha256sum ) > "$PKG/SHA256SUMS.txt"

          files_json=$( cd "$PKG" && find files -type f | sort | jq -R '{source: ., target: ("${proton}/" + .)}' | jq -cs . )
          if [ "$HAS_UNIXLIB" = "1" ]; then desc="StonkGuy/FEX eac-${V} (${COMMIT:0:9}) for Linux glibc Proton, ARM64: 2 DLLs + 2 glibc unixlibs, one matched build"
          else desc="FEX-${V} (${COMMIT:0:9}) for Linux glibc Proton, ARM64: 2 DLLs (FEX before 2607 has no unixlib)"; fi
          jq -n --arg v "${V}-eac-linux" --arg d "$desc" --argjson files "$files_json" \
            '{type: "FEXCore-Linux", versionName: $v, versionCode: 0, description: $d, author: "StonkGuy/FEX (experimental)", files: $files}' \
            > "$PKG/profile.json"

          mkdir -p out
          ( cd "$PKG" && tar -cf - . | zstd -19 -q -o "$GITHUB_WORKSPACE/out/$NAME.wcp" )
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Verify
        run: |
          set -euo pipefail
          WIN="$PKG/files/lib/wine/aarch64-windows"
          UNIX="$PKG/files/lib/wine/aarch64-unix"
          # libwow64fex.dll is plain ARM64. libarm64ecfex.dll is ARM64EC, whose header carries the
          # x86-64 machine type by design; what makes it ARM64EC is the CHPE metadata in its load config.
          file "$WIN/libwow64fex.dll"
          file "$WIN/libwow64fex.dll" | grep -q 'PE32+ executable.*Aarch64' \
            || { echo "::error::libwow64fex.dll is not an ARM64 PE DLL"; exit 1; }
          file "$WIN/libarm64ecfex.dll"
          # Output is captured first: under pipefail, grep -q closing the pipe early fails the reader.
          loadcfg=$(llvm-readobj --coff-load-config "$WIN/libarm64ecfex.dll")
          grep -q 'CHPEMetadata' <<<"$loadcfg" \
            || { echo "::error::libarm64ecfex.dll has no ARM64EC (CHPE) metadata"; exit 1; }
          if [ "$HAS_UNIXLIB" = "1" ]; then
            for f in "$UNIX"/*.so; do
              file "$f"
              file "$f" | grep -q 'ELF 64-bit LSB shared object, ARM aarch64' \
                || { echo "::error::$f is not an aarch64 ELF shared object"; exit 1; }
              needed=$(aarch64-linux-gnu-readelf -d "$f" | grep NEEDED || true)
              echo "$needed"
              # glibc, never bionic: libc.so.6 must be there, a bare libc.so must not.
              echo "$needed" | grep -q '\[libc\.so\.6\]' || { echo "::error::$f does not link glibc"; exit 1; }
              if echo "$needed" | grep -q '\[libc\.so\]'; then echo "::error::$f links bionic libc"; exit 1; fi
              max=$(aarch64-linux-gnu-readelf -V "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
              echo "highest glibc symbol version: $max"
              syms=$(aarch64-linux-gnu-readelf --dyn-syms -W "$f")
              grep -q '__wine_unix_call_funcs' <<<"$syms" \
                || { echo "::error::$f does not export __wine_unix_call_funcs"; exit 1; }
            done
          fi
          zstd -dc out/*.wcp | tar -t
          zstd -dc out/*.wcp | tar -xO ./profile.json

      - uses: actions/upload-artifact@v4
        with:
          name: FEXCore-${{ matrix.version }}-eac-linux
          path: out/*.wcp

  release:
    name: Publish
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.wcp)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no packages were built"; exit 1; fi
          ls -la artifacts

          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "FEXCore for Linux (glibc Proton, ARM64)" --notes "Being built." --latest=false
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"

          cat > notes.md <<'EOF'
          Experimental FEXCore for **Linux/glibc Proton on ARM64**, built from
          [StonkGuy/FEX eac-2610.3](https://github.com/StonkGuy/FEX/tree/eac-2610.3).

          **Important:** The WCP contains Wine/Proton FEXCore DLLs and UnixLibs only.
          It does **not** contain the Linux FEX interpreter/loader with EAC's
          ptrace, signal, seccomp and procfs patches. Installing the WCP alone
          will not enable EAC in DroidDeck. This is an experimental component
          compatibility artifact, not a validated EAC solution.
          EOF
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md --latest=false
